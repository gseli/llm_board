<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LLM Board</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

    <span id="board-title">the <em>note</em> board</span>

  <script src="canvas.js"></script>

</html>
