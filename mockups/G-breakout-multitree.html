<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mockup G — Break-out into a new tree</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700;1,400&family=Source+Code+Pro:wght@400;500;600&display=swap');

/* ============================================================
   MOCKUP G — "BREAK-OUT INTO A NEW TREE" (on top of F's tidy-tree)
   Multiple ROOTS on one canvas, each laid out as its own vertical band
   (no overlap). Break a term out of an answer → spawns a fresh independent
   tree below, with a faint DASHED origin link back to the source answer.
   Three break-out triggers, all demoed so you can pick:
     (1) SELECT text in an answer → floating "↗ break out" appears
     (2) orbit move "↗ new tree" (typed term)
     (3) DRAG a move onto empty canvas → detaches into a new tree
   Fresh start (new root = just the term, no carried history).
   ============================================================ */

*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
:root {
  --paper:#f6efe0; --card:#fffdf6; --paper-dark:#ece2cd;
  --ink:#2b2417; --ink-soft:#6b5f47; --line:rgba(43,36,23,0.12);
  --accent:#9a4032; --shadow:rgba(43,36,23,0.18);
  --term-bg:#211c15; --term-ink:#e6dcb8; --term-accent:#d2785f;
  --node:#c9a84a; --breakout:#2e6b6b;
}
body { font-family:'Lora',Georgia,serif; background:var(--paper); color:var(--ink);
  height:100vh; overflow:hidden; display:flex; flex-direction:column; }

#toolbar { display:flex; align-items:center; gap:10px; padding:12px 22px; background:var(--paper-dark);
  border-bottom:1px solid var(--line); flex-shrink:0; z-index:100; }
#board-title { font-size:1.3rem; font-weight:700; letter-spacing:-0.5px; margin-right:8px; }
#board-title em { font-style:italic; color:var(--accent); font-weight:400; }
#toolbar button { font-family:'Source Code Pro',monospace; font-size:.72rem; font-weight:600;
  text-transform:uppercase; letter-spacing:.07em; padding:7px 14px; border:1px solid var(--ink);
  background:transparent; color:var(--ink); cursor:pointer; border-radius:3px; }
#btn-reset { background:var(--accent); color:var(--paper); border-color:var(--accent); }
#hint { margin-left:auto; font-family:'Source Code Pro',monospace; font-size:.68rem; color:var(--breakout); max-width:48vw; }

#viewport { flex:1; position:relative; overflow:hidden; cursor:grab;
  background: radial-gradient(circle, rgba(43,36,23,0.06) 1px, transparent 1px) 0 0 / 26px 26px, var(--paper); }
#viewport.panning { cursor:grabbing; }
#world { position:absolute; top:0; left:0; transform-origin:0 0; will-change:transform; }
#world.cam-animate { transition:transform .5s cubic-bezier(.22,.61,.36,1); }
#wires { position:absolute; left:0; top:0; width:9000px; height:7000px; pointer-events:none; overflow:visible; }

.card, .move {
  position:absolute;
  transition: left .45s cubic-bezier(.22,.61,.36,1), top .45s cubic-bezier(.22,.61,.36,1), opacity .3s, transform .3s;
}
.card { width:260px; }
.card .inner { border:1px solid rgba(43,36,23,0.45); border-radius:4px;
  box-shadow:0 2px 0 var(--shadow), 0 6px 14px -8px rgba(43,36,23,0.4); background:var(--card); overflow:hidden; }
.card .hd { display:flex; align-items:center; padding:7px 12px; user-select:none;
  font-family:'Source Code Pro',monospace; font-size:.62rem; font-weight:600; letter-spacing:.13em;
  text-transform:uppercase; border-bottom:1px solid var(--line); color:var(--ink-soft); }
.card .hd .lbl { flex:1; }
.card .bd { padding:11px 13px; }

.card.prompt .hd { background:#f1e8d2; color:var(--accent); }
.card.prompt.origin-root .hd { background:#dceaea; color:var(--breakout); }   /* a broken-out root */
.card.prompt .q { font-family:'Lora',serif; font-size:.92rem; font-weight:600; margin-bottom:9px; }
.card.prompt .pc { display:flex; gap:7px; align-items:center; }
.pill { flex:1; font-family:'Source Code Pro',monospace; font-size:.66rem; color:var(--ink-soft);
  background:#faf4e6; border:1px solid var(--line); border-radius:18px; padding:4px 10px; }
.pill .s { color:var(--accent); }
.run { background:var(--accent); color:var(--paper); border:none; border-radius:3px; padding:5px 12px;
  font-family:'Source Code Pro',monospace; font-size:.64rem; font-weight:600; text-transform:uppercase; cursor:pointer; }

.card.response .inner { background:var(--term-bg); border-color:rgba(0,0,0,0.5); }
.card.response .hd { background:#181410; color:var(--term-accent); border-bottom-color:rgba(230,220,184,0.1); }
.card.response .hd::before { content:'▸ '; }
.card.response .bd { font-family:'Source Code Pro',monospace; font-size:.74rem; line-height:1.55;
  color:var(--term-ink); white-space:pre-wrap; cursor:text; }
.card.response .bd ::selection { background:var(--breakout); color:#fff; }
.card.response .bd::selection { background:var(--breakout); color:#fff; }

.move { display:inline-flex; align-items:center; gap:5px; background:var(--card);
  border:1px solid var(--node); color:var(--ink); font-family:'Source Code Pro',monospace; font-size:.68rem;
  padding:4px 10px; border-radius:15px; box-shadow:0 2px 6px -2px rgba(43,36,23,0.3); cursor:pointer; white-space:nowrap; }
.move .ico { color:var(--accent); font-weight:700; }
.move:hover { background:var(--node); transform:scale(1.06); }
.move.spent { opacity:.3; transform:scale(.88); box-shadow:none; }
.move.spent:hover { opacity:.65; transform:scale(.92); }
.move.ask { border-color:var(--line); color:var(--ink-soft); }
.move.newtree { border-color:var(--breakout); color:var(--breakout); }
.move.newtree .ico { color:var(--breakout); }
.move.newtree:hover { background:var(--breakout); color:#fff; }
.move.newtree:hover .ico { color:#fff; }
.move.dragging { opacity:.85; transform:scale(1.08); box-shadow:0 8px 20px -6px rgba(46,107,107,.6); cursor:grabbing; z-index:999; transition:none; }

.born { animation:born .4s cubic-bezier(.18,.7,.3,1.1) both; }
@keyframes born { from { opacity:0; transform:scale(.5); } to { opacity:1; transform:scale(1); } }

/* floating "break out" bubble shown on text selection */
#breakout-pop { position:absolute; z-index:600; display:none; align-items:center; gap:6px;
  background:var(--breakout); color:#fff; font-family:'Source Code Pro',monospace; font-size:.68rem; font-weight:600;
  padding:6px 11px; border-radius:14px; box-shadow:0 4px 12px -4px rgba(0,0,0,.5); cursor:pointer; white-space:nowrap; }
#breakout-pop:hover { filter:brightness(1.1); }

/* drop hint when dragging a move over empty canvas */
#drop-ghost { position:absolute; z-index:550; display:none; width:200px; height:60px; border:2px dashed var(--breakout);
  border-radius:6px; background:rgba(46,107,107,.08); pointer-events:none;
  font-family:'Source Code Pro',monospace; font-size:.66rem; color:var(--breakout); align-items:center; justify-content:center; }

#zoom-ui { position:absolute; right:18px; bottom:18px; display:flex; flex-direction:column; gap:6px; z-index:50; }
#zoom-ui button { width:38px; height:38px; border:1px solid var(--ink); background:var(--card); color:var(--ink);
  font-family:'Source Code Pro',monospace; font-size:1rem; cursor:pointer; border-radius:5px;
  box-shadow:0 2px 0 var(--shadow); display:flex; align-items:center; justify-content:center; }
#zoom-ui button:hover { background:var(--ink); color:var(--paper); }
#zoom-ui .fit { font-size:.58rem; font-weight:600; }
#zoom-level { text-align:center; font-family:'Source Code Pro',monospace; font-size:.62rem; color:var(--ink-soft); margin-top:2px; }

#caption { position:fixed; bottom:14px; left:22px; font-family:'Source Code Pro',monospace; font-size:.7rem;
  color:var(--ink-soft); background:var(--card); border:1px solid var(--line); padding:7px 13px; border-radius:4px; z-index:200; max-width:62vw; }
</style>
</head>
<body>
  <div id="toolbar">
    <span id="board-title">the <em>note</em> board</span>
    <button id="btn-reset">↺ reset</button>
    <span id="hint">▸ 3 ways to break out: select answer text · "↗ new tree" move · drag any move to empty canvas</span>
  </div>

  <div id="viewport">
    <div id="world">
      <svg id="wires"></svg>
      <div id="drop-ghost">drop to start a new tree</div>
    </div>
    <div id="breakout-pop">↗ break "<span id="bp-term"></span>" into a new tree</div>
    <div id="zoom-ui">
      <button id="z-in" title="Zoom in (+)">+</button>
      <button id="z-out" title="Zoom out (−)">−</button>
      <button id="z-fit" class="fit" title="Fit all (0)">FIT</button>
      <div id="zoom-level">100%</div>
    </div>
  </div>
  <div id="caption">Mockup G · break-out into independent trees — fresh-start root, faint dashed origin link, auto-arranged below. Try all 3 triggers.</div>

<script>
let uid=0; const nid=()=>'n'+(++uid);

const MOVE_DEFS=[
  { id:'more',    ico:'→', label:'more',     answer:(t)=>`More on ${t}: extra properties and where it appears in practice.` },
  { id:'why',     ico:'?', label:'why',      answer:(t)=>`Why ${t}: the mechanism is that structure/repetition drives predictability.` },
  { id:'example', ico:'◈', label:'example',  answer:(t)=>`Example of ${t}: a vivid small case — a coin flip, a die, a short sentence.` },
  { id:'relate',  ico:'⇄', label:'relate…',  answer:(t)=>`How ${t} relates to a neighbour idea: what's shared and the one axis of difference.` },
  { id:'term',    ico:'⊕', label:'term…',    answer:(t)=>`A sub-term inside ${t}, defined, and how it plugs back into the whole.` },
];
function freshMoves(){
  const m = MOVE_DEFS.map(d=>({...d,spent:false}));
  m.push({ id:'newtree', ico:'↗', label:'new tree', newtree:true, spent:false });
  m.push({ id:'ask', ico:'↩', label:'ask your own', ask:true, spent:false });
  return m;
}
function makeResponse(text,topic){ return {id:nid(),kind:'response',text,topic,children:[],moves:freshMoves()}; }
function makeRoot(term, broken){
  const p={id:nid(),kind:'prompt',text:term,topic:term,children:[],broken:!!broken};
  const r=makeResponse(`Fresh answer about “${term}”: a clean, standalone explanation starting from scratch.`, term);
  p.children=[r];
  return p;
}

// ── forest: list of root prompts ──
const roots=[];
const r0=makeRoot('Shannon entropy'); roots.push(r0);
// give the root response a real body
r0.children[0].text='Shannon entropy measures the average uncertainty in a source — the bits needed, on average, to encode the next symbol. Related ideas: redundancy, mutual information.';

// origin links: {fromRespId, toRootId}
const origins=[];

// ── tidy-tree per root, then stack roots vertically (multi-tree) ──
const COL_W=330, ROW_H=64, ORBIT_GAP=300, MOVE_H=34, CARD_W=260, TREE_GAP=70;
const layout={};
function countLeaves(node){
  if(node.kind==='response'){
    const orbit=node.moves.length;
    if(node.children.length===0) return Math.max(1,orbit);
    let s=0; node.children.forEach(k=>s+=countLeaves(k)); return Math.max(s,1);
  }
  if(node.children.length===0) return 1;
  let s=0; node.children.forEach(k=>s+=countLeaves(k)); return s;
}
function assign(node,depth,top){
  const leaves=countLeaves(node);
  layout[node.id]={x:depth*COL_W+40, y:top+(leaves*ROW_H)/2, leaves, depth};
  let c=top; node.children.forEach(k=>{ const kl=countLeaves(k); assign(k,depth+1,c); c+=kl*ROW_H; });
}
function layoutForest(){
  let top=40;
  roots.forEach(root=>{ assign(root,0,top); top += countLeaves(root)*ROW_H + TREE_GAP; });
}

const world=document.getElementById('world'), svg=document.getElementById('wires');
const els={};
function ensureCard(node){
  if(els[node.id]) return els[node.id];
  const el=document.createElement('div');
  el.className='card '+node.kind+' born'+(node.broken?' origin-root':'');
  el.dataset.id=node.id;
  if(node.kind==='prompt'){
    el.innerHTML=`<div class="inner"><div class="hd"><span class="lbl">${node.broken?'new tree':'prompt'}</span></div>
      <div class="bd"><div class="q">${node.text}</div>
      <div class="pc"><span class="pill"><span class="s">◎</span> explain term</span><button class="run">Run ▶</button></div></div></div>`;
  } else {
    el.innerHTML=`<div class="inner"><div class="hd"><span class="lbl">response</span></div>
      <div class="bd">${node.text}</div></div>`;
    // text-selection break-out hookup
    el.querySelector('.bd').addEventListener('mouseup',(e)=>{ e.stopPropagation(); onSelect(node, el); });
  }
  world.appendChild(el); els[node.id]=el; return el;
}
function ensureMove(resp,move){
  const key='move:'+resp.id+':'+move.id;
  if(els[key]) return els[key];
  const el=document.createElement('div');
  el.className='move born'+(move.ask?' ask':'')+(move.newtree?' newtree':'');
  el.innerHTML=`<span class="ico">${move.ico}</span> ${move.label}`;
  if(move.newtree){
    el.addEventListener('click',(e)=>{ e.stopPropagation(); breakOut(resp, prompt('Break out which term into a new tree?','mutual information')||'new term'); });
  } else if(!move.ask){
    el.addEventListener('click',(e)=>{ e.stopPropagation(); if(!el._dragged) fork(resp,move); });
  }
  // DRAG-to-detach for ALL non-ask moves
  if(!move.ask) attachDrag(el, resp, move);
  world.appendChild(el); els[key]=el; return el;
}

function relayout(){
  layoutForest();
  function place(node){
    const el=ensureCard(node); const p=layout[node.id];
    el.style.left=p.x+'px'; el.style.top=(p.y-el.offsetHeight/2)+'px';
    if(node.kind==='response'){
      const orbitX=p.x+CARD_W+60, totalH=(node.moves.length-1)*MOVE_H;
      node.moves.forEach((m,i)=>{ const me=ensureMove(node,m);
        me.classList.toggle('spent',!!m.spent);
        if(!me._dragging){ me.style.left=orbitX+'px'; me.style.top=(p.y-totalH/2+i*MOVE_H-12)+'px'; }
      });
    }
    node.children.forEach(place);
  }
  roots.forEach(place);
  drawWires();
}
function cardAnchor(node,side){ const el=els[node.id],p=layout[node.id],w=el.offsetWidth;
  return {x:side==='r'?p.x+w:p.x, y:p.y}; }
function moveAnchor(rid,m,side){ const el=els['move:'+rid+':'+m.id]; const x=parseFloat(el.style.left),y=parseFloat(el.style.top);
  return {x:side==='r'?x+el.offsetWidth:x, y:y+el.offsetHeight/2}; }
function drawWires(){
  svg.innerHTML='';
  const path=(a,z,kind)=>{ const dx=Math.max(30,(z.x-a.x)/2);
    const p=document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('d',`M ${a.x} ${a.y} C ${a.x+dx} ${a.y}, ${z.x-dx} ${z.y}, ${z.x} ${z.y}`);
    p.setAttribute('fill','none');
    if(kind==='origin'){ p.setAttribute('stroke','#2e6b6b'); p.setAttribute('stroke-width',1.6); p.setAttribute('stroke-dasharray','5 5'); p.setAttribute('opacity','.7'); }
    else { p.setAttribute('stroke', kind==='strong'?'#9a4032':'rgba(43,36,23,0.3)'); p.setAttribute('stroke-width', kind==='strong'?2:1.4); }
    svg.appendChild(p); };
  function walk(node){
    if(node.kind==='prompt'&&node.children[0]) path(cardAnchor(node,'r'),cardAnchor(node.children[0],'l'),'strong');
    if(node.kind==='response'){
      node.moves.forEach(m=>{ if(!m.ask&&!m.newtree&&els['move:'+node.id+':'+m.id]) path(cardAnchor(node,'r'),moveAnchor(node.id,m,'l'),'thin'); });
      node.children.forEach(c=>{ if(c._fromMove) path(moveAnchor(node.id,c._fromMove,'r'),cardAnchor(c,'l'),'strong'); });
    }
    node.children.forEach(walk);
  }
  roots.forEach(walk);
  // faint dashed origin links
  origins.forEach(o=>{ const f=els[o.fromRespId]; if(!f) return;
    path(cardAnchor({id:o.fromRespId},'r'), cardAnchor({id:o.toRootId},'l'), 'origin'); });
}

function fork(resp,move){
  if(move.spent) return; move.spent=true;
  const child=makeResponse(move.answer(resp.topic||'this'),resp.topic); child._fromMove=move;
  resp.children.push(child); relayout(); maybeNudge(child);
}

// ── BREAK OUT: new independent root below, fresh start, dashed origin link ──
function breakOut(sourceResp, term){
  term=(term||'').trim(); if(!term) return;
  const newRoot=makeRoot(term, true);
  roots.push(newRoot);
  origins.push({ fromRespId:sourceResp.id, toRootId:newRoot.id });
  relayout();
  maybeNudge(newRoot.children[0]);
}

// ── trigger 1: text selection ──
const pop=document.getElementById('breakout-pop'), bpTerm=document.getElementById('bp-term');
let pendingSel=null;
function onSelect(node, cardEl){
  const sel=window.getSelection(); const text=(sel&&sel.toString()||'').trim();
  if(!text || text.length>60){ pop.style.display='none'; return; }
  pendingSel={node, text};
  const range=sel.getRangeAt(0).getBoundingClientRect();
  const vpr=document.getElementById('viewport').getBoundingClientRect();
  bpTerm.textContent = text.length>22? text.slice(0,22)+'…' : text;
  pop.style.display='inline-flex';
  pop.style.left=(range.left-vpr.left)+'px';
  pop.style.top =(range.top-vpr.top-38)+'px';
}
pop.addEventListener('click',()=>{ if(pendingSel){ breakOut(pendingSel.node, pendingSel.text); } pop.style.display='none'; window.getSelection().removeAllRanges(); });
document.addEventListener('mousedown',(e)=>{ if(!e.target.closest('#breakout-pop')) pop.style.display='none'; });

// ── trigger 3: drag a move onto empty canvas ──
const ghost=document.getElementById('drop-ghost');
function attachDrag(el, resp, move){
  let sx,sy,moved,startL,startT;
  el.addEventListener('mousedown',(e)=>{
    if(e.button!==0) return;
    sx=e.clientX; sy=e.clientY; moved=false; el._dragged=false;
    startL=parseFloat(el.style.left)||0; startT=parseFloat(el.style.top)||0;
    const onMove=(ev)=>{
      const dx=ev.clientX-sx, dy=ev.clientY-sy;
      if(!moved && Math.hypot(dx,dy)<6) return;
      moved=true; el._dragging=true; el.classList.add('dragging');
      el.style.left=(startL+dx/cam.k)+'px'; el.style.top=(startT+dy/cam.k)+'px';
      // show ghost where it'd land (a new tree)
      ghost.style.display='flex';
      ghost.style.left=(startL+dx/cam.k+30)+'px'; ghost.style.top=(startT+dy/cam.k)+'px';
    };
    const onUp=(ev)=>{
      document.removeEventListener('mousemove',onMove); document.removeEventListener('mouseup',onUp);
      ghost.style.display='none'; el.classList.remove('dragging');
      if(moved){
        el._dragged=true; el._dragging=false;
        // dropped away → break the move's intended term out into a new tree
        const term = move.needsTerm ? 'detached term' : move.label.replace('…','');
        breakOut(resp, move.id==='term'||move.id==='relate' ? 'detached: '+move.label : move.label+' of '+(resp.topic||'this'));
        relayout(); // snap the dragged chip back into orbit
      } else {
        // treat as click
        if(!move.newtree && !move.ask) fork(resp,move);
        else if(move.newtree) breakOut(resp, prompt('Break out which term?','mutual information')||'new term');
      }
      setTimeout(()=>{ el._dragged=false; }, 50);
    };
    document.addEventListener('mousemove',onMove); document.addEventListener('mouseup',onUp);
  });
}

document.getElementById('btn-reset').onclick=()=>location.reload();

// ── camera (calm; nudge-only) ──
const vp=document.getElementById('viewport'), zlabel=document.getElementById('zoom-level');
const cam={x:0,y:0,k:1}; const MIN=0.2,MAX=2.5;
function apply(a){ world.classList.toggle('cam-animate',!!a); world.style.transform=`translate(${cam.x}px,${cam.y}px) scale(${cam.k})`; zlabel.textContent=Math.round(cam.k*100)+'%'; }
function zoomAt(px,py,k,a){ k=Math.min(MAX,Math.max(MIN,k)); const wx=(px-cam.x)/cam.k,wy=(py-cam.y)/cam.k; cam.k=k; cam.x=px-wx*cam.k; cam.y=py-wy*cam.k; apply(a); }
function center(){ const r=vp.getBoundingClientRect(); return {x:r.width/2,y:r.height/2}; }
function maybeNudge(node){ const p=layout[node.id]; if(!p)return; const el=els[node.id]; const w=el.offsetWidth||260,h=el.offsetHeight||90;
  const r=vp.getBoundingClientRect(); const sx=p.x*cam.k+cam.x, sy=(p.y-h/2)*cam.k+cam.y; const m=40; let dx=0,dy=0;
  if(sx+(w+ORBIT_GAP)*cam.k>r.width-m) dx=(r.width-m)-(sx+(w+ORBIT_GAP)*cam.k);
  if(sx<m) dx=m-sx; if(sy+h*cam.k>r.height-m) dy=(r.height-m)-(sy+h*cam.k); if(sy<m) dy=m-sy;
  if(dx||dy){ cam.x+=dx; cam.y+=dy; apply(true); } }
document.getElementById('z-in').onclick=()=>{const c=center();zoomAt(c.x,c.y,cam.k*1.25,true);};
document.getElementById('z-out').onclick=()=>{const c=center();zoomAt(c.x,c.y,cam.k/1.25,true);};
document.getElementById('z-fit').onclick=fitAll;
function fitAll(){ const ids=Object.keys(layout); let mnX=1e9,mnY=1e9,mxX=-1e9,mxY=-1e9;
  ids.forEach(id=>{const el=els[id];if(!el)return;const p=layout[id];const w=el.offsetWidth,h=el.offsetHeight;
    mnX=Math.min(mnX,p.x);mxX=Math.max(mxX,p.x+w+ORBIT_GAP);mnY=Math.min(mnY,p.y-h/2);mxY=Math.max(mxY,p.y+h/2);});
  const r=vp.getBoundingClientRect(),pad=70; const k=Math.min(MAX,Math.max(MIN,Math.min((r.width-pad*2)/(mxX-mnX),(r.height-pad*2)/(mxY-mnY))));
  cam.k=k; cam.x=(r.width-(mxX+mnX)*k)/2; cam.y=(r.height-(mxY+mnY)*k)/2; apply(true); }
vp.addEventListener('wheel',(e)=>{ if(!(e.ctrlKey||e.metaKey))return; e.preventDefault(); const r=vp.getBoundingClientRect();
  zoomAt(e.clientX-r.left,e.clientY-r.top,cam.k*(e.deltaY<0?1.12:1/1.12),false); },{passive:false});
window.addEventListener('keydown',(e)=>{ if(/INPUT|TEXTAREA/.test(e.target.tagName))return;
  if(e.key==='+'||e.key==='='){const c=center();zoomAt(c.x,c.y,cam.k*1.25,true);}
  else if(e.key==='-'||e.key==='_'){const c=center();zoomAt(c.x,c.y,cam.k/1.25,true);}
  else if(e.key==='0'){fitAll();} });
let pan=false,psx=0,psy=0,pox=0,poy=0;
vp.addEventListener('mousedown',(e)=>{ if(e.target.closest('.move,.run,#zoom-ui,.card .bd, #breakout-pop'))return;
  pan=true; vp.classList.add('panning'); psx=e.clientX; psy=e.clientY; pox=cam.x; poy=cam.y; });
window.addEventListener('mousemove',(e)=>{ if(!pan)return; cam.x=pox+(e.clientX-psx); cam.y=poy+(e.clientY-psy); apply(false); });
window.addEventListener('mouseup',()=>{ pan=false; vp.classList.remove('panning'); });

relayout();
setTimeout(()=>{ relayout(); fitAll(); }, 130);
</script>
</body>
</html>
